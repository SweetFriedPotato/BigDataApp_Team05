<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-label="PHP request and database flow"><rect width="1000" height="780" fill="#f7f5ef"/><g font-family="Arial,sans-serif" font-size="13"><rect x="20" y="20" width="280" height="100" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="20" y="20" width="280" height="32" rx="6" fill="#2c6155"/><text x="32" y="42" fill="white" font-weight="bold">Browser input</text><text x="32" y="74" fill="#233b37">GET analysis forms</text><text x="32" y="93" fill="#233b37">POST plan/reset forms + CSRF</text><rect x="360" y="20" width="280" height="100" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="360" y="20" width="280" height="32" rx="6" fill="#2c6155"/><text x="372" y="42" fill="white" font-weight="bold">bootstrap.php</text><text x="372" y="74" fill="#233b37">config + Session + escaping</text><text x="372" y="93" fill="#233b37">strict native PDO connection</text><rect x="700" y="20" width="280" height="100" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="700" y="20" width="280" height="32" rx="6" fill="#2c6155"/><text x="712" y="42" fill="white" font-weight="bold">filters.php / session.php</text><text x="712" y="74" fill="#233b37">strict dates, decimals, IDs</text><text x="712" y="93" fill="#233b37">atomic Session update</text><rect x="20" y="230" width="280" height="135" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="20" y="230" width="280" height="32" rx="6" fill="#2c6155"/><text x="32" y="252" fill="white" font-weight="bold">Analysis pages</text><text x="32" y="284" fill="#233b37">aggregate / olap / ranking / window</text><text x="32" y="303" fill="#233b37">queries.php: CTEs + prepared SQL</text><text x="32" y="322" fill="#233b37">temperature calculations in DB</text><rect x="360" y="230" width="280" height="135" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="360" y="230" width="280" height="32" rx="6" fill="#2c6155"/><text x="372" y="252" fill="white" font-weight="bold">Plan pages and actions</text><text x="372" y="284" fill="#233b37">list / form / detail</text><text x="372" y="303" fill="#233b37">POST actions + validated apply</text><text x="372" y="322" fill="#233b37">repository transaction + PRG</text><rect x="700" y="230" width="280" height="135" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="700" y="230" width="280" height="32" rx="6" fill="#2c6155"/><text x="712" y="252" fill="white" font-weight="bold">Seasonal page</text><text x="712" y="284" fill="#233b37">year/month selection</text><text x="712" y="303" fill="#233b37">independent prepared SELECTs</text><text x="712" y="322" fill="#233b37">source URLs displayed</text><rect x="200" y="480" width="600" height="110" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="200" y="480" width="600" height="32" rx="6" fill="#2c6155"/><text x="212" y="502" fill="white" font-weight="bold">MariaDB — team05 account</text><text x="212" y="534" fill="#233b37">six InnoDB tables; constraints + indexed dates</text><text x="212" y="553" fill="#233b37">COMMIT complete writes; ROLLBACK intermediate failures</text><rect x="200" y="665" width="600" height="80" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="200" y="665" width="600" height="32" rx="6" fill="#2c6155"/><text x="212" y="687" fill="white" font-weight="bold">View + header + footer</text><text x="212" y="719" fill="#233b37">escaped tables; separate menus; local CSS/JS/fonts</text><g stroke="#b45b3b" stroke-width="2" fill="none"><path d="M300 65 H360"/><path d="M640 65 H700"/><path d="M840 120 V170 H160 V230"/><path d="M500 170 V230"/><path d="M840 170 V230"/><path d="M160 365 V430 H500 V480"/><path d="M500 365 V480"/><path d="M840 365 V430 H500"/><path d="M500 590 V665"/></g></g></svg>