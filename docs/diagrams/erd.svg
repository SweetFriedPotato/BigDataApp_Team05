<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" role="img" aria-label="Six-table ERD"><rect width="1000" height="780" fill="#f7f5ef"/><g font-family="Arial,sans-serif" font-size="13"><rect x="20" y="30" width="280" height="195" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="20" y="30" width="280" height="32" rx="6" fill="#2c6155"/><text x="32" y="52" fill="white" font-weight="bold">locations</text><text x="32" y="84" fill="#233b37">PK location_id</text><text x="32" y="103" fill="#233b37">UK location_code</text><text x="32" y="122" fill="#233b37">name_en / name_ko</text><text x="32" y="141" fill="#233b37">requested_latitude</text><text x="32" y="160" fill="#233b37">requested_longitude</text><rect x="370" y="30" width="290" height="195" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="370" y="30" width="290" height="32" rx="6" fill="#2c6155"/><text x="382" y="52" fill="white" font-weight="bold">daily_temperatures</text><text x="382" y="84" fill="#233b37">PK, FK location_id</text><text x="382" y="103" fill="#233b37">PK weather_date (LST)</text><text x="382" y="122" fill="#233b37">tmean / tmax / tmin (DECIMAL)</text><text x="382" y="141" fill="#233b37">CHECK pairwise temperature order</text><text x="382" y="160" fill="#233b37">INDEX weather_date, location_id</text><rect x="20" y="310" width="280" height="245" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="20" y="310" width="280" height="32" rx="6" fill="#2c6155"/><text x="32" y="332" fill="white" font-weight="bold">saved_plans</text><text x="32" y="364" fill="#233b37">PK plan_id</text><text x="32" y="383" fill="#233b37">plan_name</text><text x="32" y="402" fill="#233b37">start_date / end_date</text><text x="32" y="421" fill="#233b37">max_temp_threshold</text><text x="32" y="440" fill="#233b37">max_temp_range</text><text x="32" y="459" fill="#233b37">memo</text><text x="32" y="478" fill="#233b37">created_at / updated_at</text><rect x="370" y="310" width="290" height="150" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="370" y="310" width="290" height="32" rx="6" fill="#2c6155"/><text x="382" y="332" fill="white" font-weight="bold">plan_locations</text><text x="382" y="364" fill="#233b37">PK, FK plan_id (CASCADE delete)</text><text x="382" y="383" fill="#233b37">PK, FK location_id</text><text x="382" y="402" fill="#233b37">INDEX location_id</text><rect x="700" y="310" width="280" height="150" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="700" y="310" width="280" height="32" rx="6" fill="#2c6155"/><text x="712" y="332" fill="white" font-weight="bold">solar_terms</text><text x="712" y="364" fill="#233b37">PK term_date</text><text x="712" y="383" fill="#233b37">term_name (repeats by year)</text><text x="712" y="402" fill="#233b37">source_url</text><text x="712" y="421" fill="#233b37">Calendar reference: no FK</text><rect x="700" y="520" width="280" height="165" rx="6" fill="#fffefb" stroke="#bccbb9"/><rect x="700" y="520" width="280" height="32" rx="6" fill="#2c6155"/><text x="712" y="542" fill="white" font-weight="bold">monthly_food_guides</text><text x="712" y="574" fill="#233b37">PK guide_id</text><text x="712" y="593" fill="#233b37">UK month_no + food_name</text><text x="712" y="612" fill="#233b37">source_url</text><text x="712" y="631" fill="#233b37">CHECK month between 1 and 12</text><text x="712" y="650" fill="#233b37">Monthly reference: no FK</text><g stroke="#b45b3b" stroke-width="2" fill="none"><path d="M300 95 H370"/><path d="M160 225 V275 H515 V310"/><path d="M300 380 H370"/></g><g fill="#b45b3b" font-size="12"><text x="306" y="83">1 → many</text><text x="318" y="266">1 → many</text><text x="305" y="365">1 → many</text></g><text x="20" y="620">Physical FKs: weather→locations; plan_locations→plans and locations.</text><text x="20" y="647">At least one location per plan is an application + transaction invariant.</text><text x="20" y="674">Solar terms and food guides use independent date/month lookups.</text><text x="20" y="701">All six tables: InnoDB, utf8mb4_unicode_ci. Exactly six BASE TABLEs.</text></g></svg>